plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nhahmed.machinery'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nhahmed.machinery'
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName '2.9.0'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The app UI is the web app in /web, shared with the browser version.
            assets.srcDirs = ['../web']
        }
    }
}

dependencies {
    // Google sign-in through Android's Credential Manager (Google blocks sign-in inside a WebView).
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
