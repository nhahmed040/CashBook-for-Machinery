name: Build CashBook for Machinery APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done

      - name: Decode permanent release keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/cashbook-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Build debug APK when signing secrets are not configured
        if: env.HAS_SIGNING_KEY != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Rename signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk CashBook-for-Machinery.apk

      - name: Rename debug APK
        if: env.HAS_SIGNING_KEY != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk CashBook-for-Machinery.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-for-Machinery-apk
          path: CashBook-for-Machinery.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CashBook-for-Machinery.apk
